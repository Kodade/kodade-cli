name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 (last Intel runner) is retired; cross-compile Intel on arm64.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --package kodade-cli --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ARCHIVE="kodade-cli-${VERSION}-${{ matrix.target }}.tar.gz"
          STAGING="package/kodade-cli-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/kodade-cli" "$STAGING/kodade-cli"
          cp LICENSE NOTICE README.md "$STAGING/"
          tar -czf "$ARCHIVE" -C package "kodade-cli-${VERSION}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kodade-cli-${{ matrix.target }}
          path: kodade-cli-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kodade-cli-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum kodade-cli-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The release job just published; give the API a moment to list assets.
          for attempt in 1 2 3 4 5 6; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS --clobber && break
            sleep 10
          done
          test -s SHA256SUMS
      - name: Render formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/homebrew-formula.sh "${TAG#v}" SHA256SUMS > kodade-cli.rb
          cat kodade-cli.rb
      - name: Push to Kodade/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the formula was rendered above but not pushed. Add the secret (contents: write on Kodade/homebrew-tap) to automate this."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Kodade/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp kodade-cli.rb tap/Formula/kodade-cli.rb
          cd tap
          git config user.name "ContractorKeith"
          git config user.email "ContractorKeith@users.noreply.github.com"
          git add Formula/kodade-cli.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "feat: kodade-cli ${TAG}"
          git push
