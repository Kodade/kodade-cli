name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 (last Intel runner) is retired; cross-compile Intel on arm64.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --package kodade-cli --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ARCHIVE="kodade-cli-${VERSION}-${{ matrix.target }}.tar.gz"
          STAGING="package/kodade-cli-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/kodade-cli" "$STAGING/kodade-cli"
          cp LICENSE NOTICE README.md "$STAGING/"
          tar -czf "$ARCHIVE" -C package "kodade-cli-${VERSION}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kodade-cli-${{ matrix.target }}
          path: kodade-cli-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kodade-cli-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum kodade-cli-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
