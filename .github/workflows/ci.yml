name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
      - name: Exercise graphics media through a real PTY
        run: python3 scripts/graphics-media-smoke.py target/debug/kodade-cli
      - name: Exercise terminal links and synchronized pane frames
        run: python3 scripts/terminal-links-tui-smoke.py target/debug/kodade-cli
      - name: Exercise terminal keyboard input through a real TUI
        if: runner.os != 'Windows'
        run: python3 scripts/terminal-keyboard-tui-smoke.py target/debug/kodade-cli
