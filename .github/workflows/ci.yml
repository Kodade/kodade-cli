name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
      - name: Exercise live client handoff
        if: runner.os != 'Windows'
        run: python3 scripts/handoff-tui-smoke.py target/debug/kodade-cli
      - name: Exercise Unix upgrade rollback and live extension context
        if: runner.os == 'Linux'
        run: |
          python3 scripts/smoke-test.py target/debug/kodade-cli
          python3 scripts/plugin-context-tui-smoke.py target/debug/kodade-cli --handoff
