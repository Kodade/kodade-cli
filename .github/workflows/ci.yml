name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: python3 scripts/test-with-diagnostics.py
        timeout-minutes: 5
      - name: Exercise live client handoff
        if: runner.os != 'Windows'
        run: python3 scripts/handoff-tui-smoke.py target/debug/kodade-cli
      - name: Exercise Unix upgrade rollback and live extension context
        if: runner.os == 'Linux'
        run: |
          python3 scripts/smoke-test.py target/debug/kodade-cli
          python3 scripts/plugin-context-tui-smoke.py target/debug/kodade-cli --handoff
      - name: Exercise graphics media through a real PTY
        run: python3 scripts/graphics-media-smoke.py target/debug/kodade-cli
      - name: Exercise terminal links and synchronized pane frames
        run: python3 scripts/terminal-links-tui-smoke.py target/debug/kodade-cli
      - name: Exercise terminal keyboard input through a real TUI
        if: runner.os != 'Windows'
        run: python3 scripts/terminal-keyboard-tui-smoke.py target/debug/kodade-cli
      - name: Exercise launch directories through real TUI clients
        run: python3 scripts/startup-directory-tui-smoke.py target/debug/kodade-cli
      - name: Exercise live terminal colors and handoff reconnect
        run: python3 scripts/terminal-colors-tui-smoke.py target/debug/kodade-cli
