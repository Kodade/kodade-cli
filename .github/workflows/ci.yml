name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-ssh-fixture:
    # Windows remote mode must talk to a Unix daemon. Build that target once
    # here; the Windows smoke imports it into an isolated WSL1 SSH fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
      - run: cargo build -p kodade-cli --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-kodade-cli
          path: target/x86_64-unknown-linux-musl/debug/kodade-cli
          if-no-files-found: error

  check:
    needs: linux-ssh-fixture
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
      - name: Verify PowerShell Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-installer-test.ps1
      - name: Download Unix SSH fixture binary
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: linux-kodade-cli
          path: .windows-ssh-fixture
      - name: Smoke native Windows daemon, loopback IPC, and ConPTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
