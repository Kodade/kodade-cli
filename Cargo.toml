[workspace]
members = [
    "crates/kodade-cli-proto",
    "crates/kodade-cli-daemon",
    "crates/kodade-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["ContractorKeith"]

[workspace.dependencies]
# Base64 encodes bounded Kitty image transfers without copying raw terminal escape sequences.
base64 = "0.22"
# `anyhow` keeps the small binary boundary readable without a custom error hierarchy yet.
anyhow = "1"
# clap gives the binary real subcommand help, typed flags, and future completions.
clap = { version = "4", features = ["derive"] }
# `clap_complete` generates the zsh/bash/fish completion scripts from the same
# command tree, so the shipped completions can never drift from the CLI (#16).
clap_complete = "4"
# Crossterm and ratatui provide the portable terminal event and rendering stack.
crossterm = "0.29"
# `dirs` supplies the cross-platform home-directory fallback for socket state.
dirs = "5"
flate2 = "1"
libc = "0.2"
# Portable-pty hosts the login shell independently from the attaching client.
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
# `regex` gives scripting waits real pattern matching without asking callers to poll screens.
regex = "1"
# Serde JSON is the documented, script-friendly daemon protocol.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
# TOML plus Serde derives load public agent-detection manifests without a custom parser.
toml = "0.8"
# `toml_edit` merges the Codex `notify` entry into config.toml without dropping user comments (#20 reuses it).
toml_edit = "0.22"
# Tokio multiplexes clients while the blocking PTY reader uses its blocking pool.
tokio = { version = "1", features = ["io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# vt100 makes the daemon the durable owner of screen and scrollback state.
vt100 = { package = "atuin-vt100", version = "0.19.1" }
# Observe the same terminal controls as vt100 to keep image anchors with text.
vte = "0.15"
unicode-width = "0.2"
# Validate PNG uploads with bounded decompression before retaining attachments.
png = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
getrandom = "0.2"

[workspace.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"]
